[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-medicine"
version = "0.1.0"
description = "医学科研智能助手平台 — RAG + Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.12.0",
]
rag = [
    "paper-qa>=5.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "openai>=1.30.0",
    "litellm>=1.40.0",
]
pubmed = ["biopython>=1.83"]
full = ["rag-medicine[dev,rag,pubmed]"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that may call explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
