[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-medicine"
version = "0.1.0"
description = "医学科研智能助手平台 — RAG + Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "PyYAML>=6.0.3",
    "cryptography>=45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mypy>=1.19.0",
    "ruff>=0.12.0",
    "reportlab>=5.0.0",
    "types-PyYAML>=6.0.12.20260724",
]
rag = [
    "paper-qa==2026.3.18",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "openai>=1.30.0",
    "litellm>=1.40.0",
]
pubmed = ["biopython>=1.83"]
agent = ["langgraph>=1.2.10,<2.0.0"]
full = ["rag-medicine[dev,rag,pubmed,agent]"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: tests that may call explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint.per-file-ignores]
# FastAPI 官方依赖注入与 Query 声明使用函数默认值；该规则不适用于路由层。
"app/**/*router.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app/cli", "app/integrations"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["paperqa", "paperqa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scispaCy is an optional local integration; its guarded import must not make
# the baseline static check depend on a heavyweight NLP runtime.
module = ["spacy", "spacy.*"]
ignore_missing_imports = true
